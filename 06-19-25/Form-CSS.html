<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>
        Formulário CSS
    </title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Formulário CSS</h1>
        <p>Este exemplo demonstra como aplicar estilos CSS a um formulário HTML.</p>
    </div>
    <div class="container">
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            <br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
            <br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
            <br>

            <label for="data">Data de nascimento:</label>
            <input type="date" id="data" name="data">
            <br>

            <label for="arquivo">Enviar arquivo:</label>
            <input type="file" id="arquivo" name="arquivo">
            <br>

            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" placeholder="Digite sua mensagem"></textarea>
            <br>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado">
                <option value="sp">São Paulo</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="mg">Minas Gerais</option>
                <option value="rs">Rio Grande do Sul</option>
                <option value="pr">Paraná</option>
            </select>
            <br>

            <label for="genero">Gênero:</label>
            <br>
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="genero" value="feminino">
            <label for="feminino">Feminino</label>
            <input type="radio" id="outro" name="genero" value="outro">
            <label for="outro">Outro</label>
            <br>

            <label for="interesses">Interesses:</label>
            <br>
            <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
            <label for="tecnologia">Tecnologia</label>
            <input type="checkbox" id="esportes" name="interesses" value="esportes">
            <label for="esportes">Esportes</label>
            <input type="checkbox" id="musica" name="interesses" value="musica">
            <label for="musica">Música</label>
            <input type="checkbox" id="viagens" name="interesses" value="viagens">
            <label for="viagens">Viagens</label>
            <input type="checkbox" id="leitura" name="interesses" value="leitura">
            <label for="leitura">Leitura</label>
            <br>

            <button type="submit" onclick="alert('Formulário enviado')">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </div>
</body>

</html>
